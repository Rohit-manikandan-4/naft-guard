services:
  - type: web
    name: naft-guard-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: AI_MODULE_DIR
        value: /opt/render/project/src/AI_MODULE
      - key: DATABASE_URL
        sync: false
      # Render's free plan caps memory at 512MB. torch alone adds ~150MB of
      # resident memory just from being imported — switching to ONNX Runtime
      # (same trained weights, see backend/export_onnx.py) cuts baseline
      # memory from ~315MB to ~195MB. We deliberately don't even install
      # torch here (see buildCommand above) since it isn't needed.
      - key: INFERENCE_ENGINE
        value: onnx
      # Cap the longest side of any input image so the AI module's own
      # tiled-array memory use stays well under the limit too. Full-
      # resolution scenes still work fine locally.
      - key: MAX_IMAGE_DIMENSION
        value: "1800"

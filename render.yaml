services:
  - type: web
    name: naft-guard-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: AI_MODULE_DIR
        value: /opt/render/project/src/AI_MODULE
      - key: DATABASE_URL
        sync: false
      # Render's free plan caps memory at 512MB — cap the longest side of
      # any input image so the AI module's own tiled-array memory use stays
      # well under that. Full-resolution scenes still work fine locally.
      - key: MAX_IMAGE_DIMENSION
        value: "1800"

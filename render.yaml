services:
  - type: web
    name: naft-guard-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: AI_MODULE_DIR
        value: /opt/render/project/src/AI_MODULE
      - key: DATABASE_URL
        sync: false
